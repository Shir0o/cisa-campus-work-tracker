name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  e2e-test:
    name: E2E Playwright Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests against Firebase Emulator
        run: npm run test:e2e:emulator
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mobile-test:
    name: Mobile Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # apps/mobile is self-contained (its own lockfile + node_modules), but the
      # suite compiles @cisa/core's TypeScript, whose imports (firebase,
      # date-fns, @babel/runtime) resolve from the REPO ROOT's node_modules on
      # every dev machine — the root tree has to be installed here too, or
      # typecheck and jest fail with "Cannot find module". `npm ci` also runs
      # apps/mobile's postinstall patch-package step.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
