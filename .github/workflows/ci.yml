name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run check:colors
      - run: npm run test:coverage
      - run: npm run build

  mobile-test:
    name: Mobile Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # apps/mobile is self-contained (its own lockfile + node_modules), but the
      # suite compiles @cisa/core's TypeScript, whose imports (firebase,
      # date-fns, @babel/runtime) resolve from the REPO ROOT's node_modules on
      # every dev machine — the root tree has to be installed here too, or
      # typecheck and jest fail with "Cannot find module". `npm ci` also runs
      # apps/mobile's postinstall patch-package step.
      # The colour-token regression guard scopes to src/ and apps/mobile/src/
      # component source, so mobile-only changes can still introduce raw hex
      # values or Tailwind palette utilities — run it from the root here.
      - run: npm run check:colors
        working-directory: .
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
