name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot PRs run on GitHub-hosted runners so they never occupy the single
  # self-hosted runner; real (non-dependabot) PRs keep the local runner to
  # themselves and are effectively prioritized.
  test:
    name: Lint & Test
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run test:coverage
      - run: npm run build

  mobile-test:
    name: Mobile Lint & Test
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # apps/mobile is self-contained (its own lockfile + node_modules), but the
      # suite compiles @cisa/core's TypeScript, whose imports (firebase,
      # date-fns, @babel/runtime) resolve from the REPO ROOT's node_modules on
      # every dev machine — the root tree has to be installed here too, or
      # typecheck and jest fail with "Cannot find module". `npm ci` also runs
      # apps/mobile's postinstall patch-package step.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
