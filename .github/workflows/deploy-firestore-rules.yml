name: Deploy Firestore Rules

# Publishes firestore.rules and firestore.indexes.json to the live project on
# merge to main, so rules/index changes no longer have to be published by hand
# (Console / `firebase deploy`).
#
# Auth: keyless via Workload Identity Federation (WIF). GitHub's per-run OIDC
# token is exchanged for short-lived credentials that impersonate the deploy SA
# github-action@sac-campus-hub (which holds roles/firebaserules.admin +
# roles/datastore.indexAdmin). No service-account key is stored anywhere; the
# token exchange is scoped by an attribute condition to this repo only.

on:
  # Manual trigger — re-publish rules or validate the deploy credential without
  # a code change. (GitHub only allows this once the workflow is on the default
  # branch.)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firestore-rules.yml
      - src/test/firestore.rules.test.ts

# Never let two rule deploys race each other.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate the deploy on the emulator-backed rules tests. These run only when the
  # Firestore emulator is up (FIRESTORE_EMULATOR_HOST is set by emulators:exec),
  # so they stay skipped in the normal CI / local `npm test` run.
  test-rules:
    name: Rules tests (Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15
      - name: Run rules tests against the Firestore emulator
        run: >
          firebase emulators:exec
          --only firestore
          --project demo-campus-hub
          "npx vitest run src/test/firestore.rules.test.ts"

  deploy:
    name: Deploy Firestore rules
    needs: test-rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token: write is required to mint the GitHub OIDC token that WIF exchanges
    # for short-lived GCP credentials. Scoped to this job so test-rules doesn't get it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15
      # Authenticates the Firebase CLI non-interactively via WIF: this action
      # exchanges the GitHub OIDC token for short-lived credentials, writes them to
      # a temp file, and exports GOOGLE_APPLICATION_CREDENTIALS, which the CLI honors.
      # No long-lived key is involved.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: sac-campus-hub
          workload_identity_provider: projects/914549253362/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action@sac-campus-hub.iam.gserviceaccount.com
      - name: Deploy Firestore rules + indexes
        run: >
          firebase deploy
          --only firestore:rules,firestore:indexes
          --project sac-campus-hub
          --non-interactive
