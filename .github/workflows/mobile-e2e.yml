name: Mobile E2E (Maestro)

on:
  schedule:
    # Run every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Mobile E2E (Android Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --prefix ../..
          npm ci

      - name: Install Maestro CLI
        run: |
          curl -FsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f google-services.json ]; then
            cp google-services.example.json google-services.json
          fi

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Run Maestro E2E tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          working-directory: apps/mobile
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/

      - name: Upload Maestro output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-artifacts
          path: ~/.maestro/tests/
          retention-days: 7
