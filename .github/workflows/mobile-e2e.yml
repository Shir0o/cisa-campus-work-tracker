name: Mobile E2E (Maestro)

on:
  schedule:
    # Run every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Mobile E2E (Android Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --prefix ../..
          npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f google-services.json ]; then
            cp google-services.example.json google-services.json
          fi

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Release, not debug: a debug APK loads its JS from Metro, which never
      # runs here, so the app opened on a red "Unable to load script" screen
      # and every flow failed on its first assertion (#1683). The release
      # variant embeds the bundle and is signed with the debug keystore.
      # Same EXPO_PUBLIC_* as eas.json's `qa` profile. Without the API key the
      # app throws auth/invalid-api-key while loading and closes before any
      # screen renders (#1683).
      - name: Build Android Release APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_FIRESTORE_DB_ID: qa-db
          EXPO_PUBLIC_API_URL: https://cisa-campus-work-tracker-qa.pages.dev
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Run Maestro E2E tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          working-directory: apps/mobile
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            # On failure, print what the app actually showed and logged, so the
            # cause is readable in the job log without the artifact.
            maestro test .maestro/ || { adb shell uiautomator dump /sdcard/ui.xml; adb shell cat /sdcard/ui.xml; echo; adb logcat -d -s ReactNativeJS:V ReactNative:V AndroidRuntime:E | tail -n 200; exit 1; }

      - name: Upload Maestro output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-artifacts
          path: ~/.maestro/tests/
          retention-days: 7
