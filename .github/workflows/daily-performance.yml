name: Daily Performance & Quality Pipeline

on:
  schedule:
    # 03:00 UTC daily
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-performance
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  performance-and-quality:
    name: Daily Synthetic & Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore daily metrics baseline cache
        uses: actions/cache@v4
        with:
          path: .cache/
          key: daily-metrics-baseline-${{ github.sha }}
          restore-keys: |
            daily-metrics-baseline-

      - name: Build web application
        run: npm run build

      - name: Measure bundle sizes & chunk budgets
        run: npx tsx scripts/measure-bundle.ts

      - name: Run Lighthouse CI (Synthetic Core Web Vitals)
        continue-on-error: true
        run: |
          npx @lhci/cli@0.14.x collect
          npx @lhci/cli@0.14.x assert || true

      - name: Generate Scorecard & Update Rolling Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/generate-scorecard.ts --publish

      - name: Upload performance & audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-and-quality-artifacts-${{ github.run_id }}
          path: |
            dist/bundle-scorecard.json
            .lighthouseci/
            .cache/rolling-history.json
          retention-days: 30
