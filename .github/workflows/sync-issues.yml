name: Sync GitHub Issues to Docs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Issues to docs/issues.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch and Sync GitHub Issues
        run: npm run sync:issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/issues.json
          if ! git diff --staged --quiet; then
            git commit -m "docs: sync github issues into docs/issues.json [skip ci]"
            git push
          else
            echo "No changes in docs/issues.json to commit."
          fi
