name: Release iOS

# Fires when release-please pushes a version tag (e.g. v1.4.0).
#
# Builds a signed .ipa on the runner itself with `eas build --local`, then
# submits it to TestFlight. There is deliberately no --auto-submit anywhere: the
# build lands in TestFlight and a human promotes it. See RELEASING.md.
#
# Also dispatchable by hand so a failed release can be retried without
# cutting a new version. See RELEASING.md.
on:
  push:
    tags: ['v*']
  # A tag is the only automatic trigger, which means a transient CI failure used
  # to cost a whole new version. This lets a failed release be retried against
  # the tag it was meant for. The workflow file comes from the branch this is
  # dispatched on; the code comes from the tag given here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and submit, e.g. v1.4.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ios-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build IPA and submit to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    environment: mobile-release
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Resolve the release tag
        id: release
        # The job-level default working directory is apps/mobile, which does not
        # exist until checkout has run. This step runs before it.
        working-directory: .
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      # react-native's Podfile hard-fails below Xcode 16.1 ("React Native
      # requires XCode >= 16.1"), and macos-14 ships 15.4. Pick the newest Xcode
      # on the image and refuse to continue on one that is too old, so the
      # failure is one line instead of a cryptic invalid-Podfile error.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_APP"
          VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          echo "Selected $XCODE_APP (Xcode $VERSION)"
          if [ "$(printf '%s\n' 16.1 "$VERSION" | sort -V | head -1)" != "16.1" ]; then
            echo "::error::Xcode $VERSION is below 16.1, which React Native 0.81 requires."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Verify release secrets are present
        env:
          EAS_CREDENTIALS_B64: ${{ secrets.EAS_CREDENTIALS_B64 }}
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          missing=()
          for var in EXPO_TOKEN EAS_CREDENTIALS_B64 ASC_API_KEY_P8_B64; do
            if [ -z "${!var:-}" ]; then missing+=("$var"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "::error::See RELEASING.md for the one-time setup."
            exit 1
          fi
          echo "All iOS release secrets present."

      # ascAppId / appleTeamId / ascApiKeyId / ascApiKeyIssuerId live in
      # apps/mobile/eas.json, not in secrets: `eas submit` has no CLI flag for
      # any of them, and the Key ID and Issuer ID are identifiers rather than
      # credentials (Apple treats only the .p8 as secret). Fail here, early and
      # legibly, instead of at the end of a 20-minute macOS build.
      - name: Verify the App Store Connect submit config is filled in
        working-directory: .
        run: |
          set -euo pipefail
          if grep -n 'REPLACE_WITH_' apps/mobile/eas.json; then
            echo "::error::apps/mobile/eas.json still contains placeholders (listed above)."
            echo "::error::Fill in the submit.production.ios block. See RELEASING.md section B."
            exit 1
          fi
          echo "App Store Connect submit config looks filled in."

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install mobile dependencies
        run: npm ci

      - name: Derive version and build number from the tag
        id: version
        run: npx tsx scripts/mobile-version.ts --tag "${{ steps.release.outputs.tag }}"
        working-directory: .

      - name: Materialize EAS build credentials
        env:
          EAS_CREDENTIALS_B64: ${{ secrets.EAS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$EAS_CREDENTIALS_B64" | base64 -d | tar xzf - -C .
          chmod 600 credentials.json
          echo "credentials.json and the files it points at materialized (contents not echoed)."

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_B64: ${{ secrets.ASC_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_B64" | base64 -d > asc-api-key.p8
          chmod 600 asc-api-key.p8
          echo "asc-api-key.p8 materialized (contents not echoed)."

      - name: Build signed IPA locally
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx eas-cli build --local --platform ios --profile production --non-interactive --output ./artifacts/app-release.ipa

      - name: Compile TestFlight release notes
        run: npx tsx scripts/store-release-notes.ts --platform testflight --version "${{ steps.version.outputs.version }}" --out apps/mobile/artifacts/testflight-release-notes.txt
        working-directory: .

      - name: Submit IPA to TestFlight
        run: |
          set -euo pipefail
          npx eas-cli submit --platform ios --profile production \
            --path ./artifacts/app-release.ipa \
            --what-to-test "$(cat ./artifacts/testflight-release-notes.txt)" \
            --non-interactive

      - name: Attach artefacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release.outputs.tag }}" \
            apps/mobile/artifacts/app-release.ipa \
            apps/mobile/artifacts/testflight-release-notes.txt \
            --clobber
        working-directory: .
