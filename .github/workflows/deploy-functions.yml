name: Deploy Notification Functions

# Publishes firebase-functions/ (the push dispatcher: every new bell entry is
# pushed to the recipient's registered devices) on merge to main.
#
# Auth: keyless via Workload Identity Federation, the same deploy SA as the
# rules workflows. For a functions deploy it additionally needs
# roles/cloudfunctions.developer, roles/run.admin, roles/eventarc.admin,
# roles/iam.serviceAccountUser, roles/artifactregistry.admin and
# roles/secretmanager.viewer. Secrets EXPO_ACCESS_TOKEN and VAPID_PRIVATE_KEY
# must exist in Secret Manager (`firebase functions:secrets:set <NAME>`).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firebase-functions/**
      - firebase.json
      - .github/workflows/deploy-functions.yml

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Functions tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase-functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy functions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: firebase-functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: sac-campus-hub
          workload_identity_provider: projects/914549253362/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action@sac-campus-hub.iam.gserviceaccount.com
      - name: Deploy notification functions
        run: >
          firebase deploy
          --only functions:notifications
          --project sac-campus-hub
          --non-interactive
          --force
