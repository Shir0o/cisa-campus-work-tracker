name: Web E2E (Playwright)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/**'
      - 'packages/core/**'
      - 'server.ts'
      - 'firestore.rules'
      - 'e2e/**'
      - 'scripts/seed-emulator.ts'
      - 'package*.json'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-emulator:
    name: E2E Playwright (shard ${{ matrix.shard }}/2, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Advisory check: a red shard must not cancel the other, so the report
      # shows every failure instead of only the first.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests against Firebase Emulator
        # "npm run ... -- <args>" appends the args to the script's last command,
        # so run-e2e-emulator.sh receives them and forwards them to playwright.
        # @quarantine tests are skipped here: a flaky test must not hold the
        # run red while it is fixed or deleted within 7 days (AGENTS.md §8).
        run: npm run test:e2e:emulator -- --shard=${{ matrix.shard }}/2 --grep-invert @quarantine
      - name: Run quarantined E2E tests (advisory)
        # Still run the quarantined specs so a quarantine does not become a
        # graveyard. Advisory: a red quarantined spec never blocks the job.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:e2e:emulator -- --shard=${{ matrix.shard }}/2 --grep @quarantine --pass-with-no-tests
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
