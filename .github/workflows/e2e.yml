name: E2E permissions

# These tests sign in as the four real Firebase email/password test users and
# assert the role-based permission matrix (landing route, sidebar nav, route
# guards). They hit the REAL sac-campus-hub project, so they are gated rather
# than run on every push:
#   - manually via "Run workflow" (workflow_dispatch), or
#   - on a pull request once it carries the `e2e` label.
# The job is intentionally NOT part of the required-checks ruleset (non-blocking)
# until it has proven stable.
#
# Required repo secrets (set under Settings → Secrets and variables → Actions):
#   - VITE_FIREBASE_API_KEY  — the Firebase web API key
#   - E2E_TEST_CREDENTIALS   — the full JSON contents of e2e/.test-credentials.json
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Role-based permissions
    # Only run on manual dispatch, or on a PR that carries the `e2e` label.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Write test credentials
        run: printf '%s' "$E2E_TEST_CREDENTIALS" > e2e/.test-credentials.json
        env:
          E2E_TEST_CREDENTIALS: ${{ secrets.E2E_TEST_CREDENTIALS }}
      - name: Run E2E permission tests
        run: npm run test:e2e
        env:
          # The dev server is auto-started by playwright.config.ts with
          # VITE_E2E_MODE=true; it reads the API key from this env var.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
