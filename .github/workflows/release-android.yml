name: Release Android

# Fires when release-please pushes a version tag (e.g. v1.4.0).
#
# Builds a signed AAB on the runner itself with `eas build --local`, so no EAS
# cloud build minutes are consumed, then submits it to the Play Console internal
# track as a draft — internal testers are NOT notified. Promotion to production
# stays a manual Play Console click. See RELEASING.md.
on:
  push:
    tags: ['v*']
  # A tag is the only automatic trigger, which means a transient CI failure used
  # to cost a whole new version. This lets a failed release be retried against
  # the tag it was meant for. The workflow file comes from the branch this is
  # dispatched on; the code comes from the tag given here.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and submit, e.g. v1.4.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build AAB and submit to Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-release
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Resolve the release tag
        id: release
        # The job-level default working directory is apps/mobile, which does not
        # exist until checkout has run. This step runs before it.
        working-directory: .
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      # `eas build --local` runs Gradle, which needs a JDK. The runner image has
      # one, but not a pinned one, and Expo SDK 54 / RN 0.81 expect 17. This
      # mirrors mobile-e2e.yml, which pins the same version for the same reason.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify release secrets are present
        env:
          EAS_CREDENTIALS_B64: ${{ secrets.EAS_CREDENTIALS_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          missing=()
          for var in EXPO_TOKEN EAS_CREDENTIALS_B64 PLAY_SERVICE_ACCOUNT_JSON_B64; do
            if [ -z "${!var:-}" ]; then missing+=("$var"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "::error::See RELEASING.md for the one-time setup."
            exit 1
          fi
          echo "All Android release secrets present."

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Install mobile dependencies
        run: npm ci

      - name: Derive version and build number from the tag
        id: version
        run: npx tsx scripts/mobile-version.ts --tag "${{ steps.release.outputs.tag }}"
        working-directory: .

      - name: Materialize EAS build credentials
        env:
          EAS_CREDENTIALS_B64: ${{ secrets.EAS_CREDENTIALS_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$EAS_CREDENTIALS_B64" | base64 -d | tar xzf - -C .
          chmod 600 credentials.json
          echo "credentials.json and the files it points at materialized (contents not echoed)."

      - name: Materialize Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 -d > play-service-account.json
          chmod 600 play-service-account.json
          echo "play-service-account.json materialized (contents not echoed)."

      - name: Build signed AAB locally
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx eas-cli build --local --platform android --profile production --non-interactive --output ./artifacts/app-release.aab

      - name: Compile Play release notes
        run: npx tsx scripts/store-release-notes.ts --platform play --version "${{ steps.version.outputs.version }}" --out apps/mobile/artifacts/play-release-notes.txt
        working-directory: .

      - name: Submit AAB to the Play internal track
        run: npx eas-cli submit --platform android --profile production --path ./artifacts/app-release.aab --non-interactive

      # No Gemfile.lock is committed on purpose. One resolved on a developer's
      # machine would pin gems against that machine's Ruby and could contradict
      # the runner's, so the runner resolves against its own Ruby instead.
      - name: Setup Ruby for fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: apps/mobile

      - name: Install fastlane
        run: bundle install

      - name: Attach release notes to the Play internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ./play-service-account.json
          VERSION_CODE: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          CHANGELOG_DIR="fastlane/metadata/android/en-US/changelogs"
          mkdir -p "$CHANGELOG_DIR"
          cp artifacts/play-release-notes.txt "$CHANGELOG_DIR/${VERSION_CODE}.txt"
          echo "Staged $(wc -c < "$CHANGELOG_DIR/${VERSION_CODE}.txt") bytes of notes for version code ${VERSION_CODE}."
          bundle exec fastlane play_upload_notes version_code:"$VERSION_CODE"

      - name: Attach artefacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release.outputs.tag }}" \
            apps/mobile/artifacts/app-release.aab \
            apps/mobile/artifacts/play-release-notes.txt \
            --clobber
        working-directory: .
