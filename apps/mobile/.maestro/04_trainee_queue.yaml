appId: com.cisa.campus
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn:
    id: "sign-in-email"
- inputText: ${TRAINEE_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${TRAINEE_PASSWORD}
- tapOn:
    id: "sign-in-submit"

# A release note ("A few things are different") covers the first screen of
# every fresh install; `clearState` makes every flow a fresh install.
- runFlow:
    when:
      visible: "Carry on"
    commands:
      - tapOn: "Carry on"

# Trainee Focus Queue — qa-db seeds an overdue Board to-do, so the first card
# is a "due" card and carries the primary action. The foot is fixed to the
# card's bottom (not scrollable), so the secondary row is on screen too: the
# earlier "below the fold" note came from the pre-#1719 card, whose labels also
# carried a " →" suffix that never matched an exact text assertion.
- extendedWaitUntil:
    visible: "Mark it done"
    timeout: 20000
- assertVisible: "Later today"

# Drawer Navigation
- tapOn:
    id: "open-drawer"
- assertVisible: "The queue is the app. Everything else lives here."
- assertVisible: "People"
- assertVisible: "The Journey"
- assertVisible: "Messages"
