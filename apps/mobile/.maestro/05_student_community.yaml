appId: com.cisa.campus
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn:
    id: "sign-in-email"
- inputText: ${STUDENT_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${STUDENT_PASSWORD}
- tapOn:
    id: "sign-in-submit"

# Student View
- extendedWaitUntil:
    visible: "Bring someone with you"
    timeout: 20000
- tapOn: "Prayer"
- assertVisible: "Ask the team to pray"
- tapOn: "You"
- assertVisible: "Who to reach"

# Community View Sign in
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn:
    id: "sign-in-email"
- inputText: ${COMMUNITY_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${COMMUNITY_PASSWORD}
- tapOn:
    id: "sign-in-submit"

# Community Hospitality Offer
- extendedWaitUntil:
    visible: "Open your home"
    timeout: 20000
- assertVisible: "Offer to host"
- tapOn: "Prayer"
- assertVisible: "Names, not cases. Thank you for carrying them."
