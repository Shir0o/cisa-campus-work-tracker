appId: com.cisa.campus
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn:
    id: "sign-in-email"
- inputText: ${FT_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${FT_PASSWORD}
- tapOn:
    id: "sign-in-submit"

# A release note ("A few things are different") covers the first screen of
# every fresh install; `clearState` makes every flow a fresh install.
- runFlow:
    when:
      visible: "Carry on"
    commands:
      - tapOn: "Carry on"

# Full-timer Home / My Day
- extendedWaitUntil:
    visible: "Log a moment"
    timeout: 20000
- assertVisible: "Hand something over"

# People Tab
- tapOn: "People"
- assertVisible: "Find someone by name, major, hall…"

# More Tab
# #1800, ADR 0047: The Journey is People's Step pills now, not a More row — the
# old assertion outlived the row and is what turned this flow red on
# 2026-10-25. So FT_MORE's real rows are named, and the row that left is
# asserted absent.
- tapOn: "More"
- assertVisible: "Gatherings"
- assertVisible: "Prayer log"
- assertVisible: "The Board"
- assertVisible: "Outreach"
- assertVisible: "Sign-up form"
- assertVisible: "How this works"
- assertNotVisible: "The Journey"
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "See it as they do"
    direction: DOWN
