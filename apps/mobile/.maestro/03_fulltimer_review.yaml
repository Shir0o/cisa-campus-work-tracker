appId: com.cisa.campus
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- tapOn:
    id: "sign-in-email"
- inputText: ${FT_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${FT_PASSWORD}
- tapOn:
    id: "sign-in-submit"

# Full-timer Home / My Day
- extendedWaitUntil:
    visible: "Log a moment"
    timeout: 20000
- assertVisible: "Hand something over"

# People Tab
- tapOn: "People"
- assertVisible: "Find someone by name, major, hall…"

# More Tab
- tapOn: "More"
- assertVisible: "The Journey"
- assertVisible: "The Board"
- assertVisible: "Sign-up form"
- assertVisible: "How this works"
- assertVisible: "Settings"
- assertVisible: "See it as they do"
