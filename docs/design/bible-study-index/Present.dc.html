    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:Lexend,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px}
    a:hover{color:var(--primary)}
    svg{display:block}
    .dsp{font-family:"Plus Jakarta Sans",sans-serif}
    .app{width:390px;height:844px;display:flex;flex-direction:column;background:#FFFFFF;
      padding:14px 24px 26px}
    .bar{flex:none;height:44px;display:flex;align-items:center}
    .x{width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;
      justify-content:center;color:var(--text-dim)}
    .who{margin-left:auto;margin-right:auto;padding-right:34px;font-size:13px;font-weight:500;color:var(--text-mute)}
    .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
    .qrcard{padding:20px;background:#FFFFFF;border:1px solid var(--border);border-radius:28px;
      box-shadow:0 10px 34px rgba(10,10,11,0.09)}
    .idn{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
    .idn-w{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.02em}
    .idn-s{font-size:13px;color:var(--text-mute)}
    .foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
    .url{font-size:12px;color:var(--text-dim)}
    .awake{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mute)}
  </style>
</helmet>
