<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today · Who are we praying for?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Lexend:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#52525B}a:hover{color:#0A0A0B}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tp-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;font-size:14px;color:#0A0A0B}
.tp-row.held{color:#A1A1AA}
.tp-cb{width:16px;height:16px;border-radius:4px;border:1px solid #A1A1AA;box-sizing:border-box;flex:none;display:grid;place-items:center;color:transparent}
.on .tp-cb{background:#131316;border-color:#131316;color:#FFFFFF}
.held .tp-cb{background:#EAEAEC;border-color:#E4E4E7}
</style>
</helmet>
<div style="position:relative;width:720px;height:900px;overflow:hidden;font-family:Lexend,sans-serif;background:#FFFFFF">
  <div style="position:absolute;left:40px;top:40px;width:240px;height:28px;background:#F4F4F5;border-radius:14px"></div>
  <div style="position:absolute;left:40px;top:96px;width:640px;height:160px;background:#F4F4F5;border-radius:14px"></div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.4)"></div>

  <div role="dialog" aria-label="Who are we praying for?" style="position:absolute;left:136px;top:40px;width:448px;background:#EAEAEC;border:1px solid #F0F0F2;border-radius:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);overflow:hidden">
    <div style="padding:24px;display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1"><h2 style="margin:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:400;color:#0A0A0B">Who are we praying for?</h2><p style="margin:4px 0 0;font-size:12px;color:#52525B">Tick the people you want on this page.</p></div>
      <svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px;color:#0A0A0B;margin-top:6px"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </div>
    <div style="padding:0 24px 12px"><div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F4F4F5;border:1px solid #F0F0F2;border-radius:16px;font-size:14px;color:rgba(82,82,91,.6)"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Search the people you know…</div></div>
    <div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
        <label class="{{p.cls}}"><span class="tp-cb"><svg class="ic" viewBox="0 0 24 24" style="width:10px;height:10px;stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span><span style="flex:1">{{p.name}}</span><span style="font-size:11px;color:#A1A1AA">{{p.sub}}</span></label>
      </sc-for>
    </div>
    <div style="padding:16px 24px;border-top:1px solid #F0F0F2;font-size:12px;color:#52525B">7 people on our hearts</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (name, st) => ({ name, sub: st === 'held' ? 'already on our prayer list' : '', cls: 'tp-row' + (st ? ' ' + st : '') });
    return {
      people: [r('Ana Peinado', 'held'), r('Bao Nguyen', 'on'), r('Chidi Okafor', ''), r('Elena Garcia', 'on'), r('Grace Kim', 'held'), r('Jun Park', ''), r('Luis Peinado', ''), r('Mei Lin', '')],
    };
  }
}
</script>
</body>
</html>
